name: Clarity MCP checks
on:
  push:
    paths: ['integrations/clarity-mcp/**', '.github/workflows/clarity-mcp.yml']
  pull_request:
    paths: ['integrations/clarity-mcp/**', '.github/workflows/clarity-mcp.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/clarity-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/clarity-mcp/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:upstream
      - run: npm audit --omit=dev --audit-level=high
